name: Check skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan secrets and history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check public files and reachable Git history
        run: python scripts/secret_scan.py --history
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan reachable Git history with Gitleaks
        run: gitleaks git --redact --log-opts="--all" .

  check:
    needs: secrets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Limit maintained code to 300 physical lines
        run: python scripts/check_code_size.py
      - name: Check canonical diagram resources and examples
        run: python scripts/dynamic_umls.py --check
      - name: Validate catalog
        run: python scripts/skills.py check
      - name: Check standalone lifecycle resources
        run: python scripts/ct_lifecycle.py --check
      - name: Check public files for credential signatures
        run: python scripts/secret_scan.py
      - name: Test safe installation and packaging
        run: python -m unittest discover -s tests -v
      - name: Build downloadable skill archives
        run: python scripts/skills.py build
      - name: Check packaged files for credential signatures
        run: python scripts/secret_scan.py --packages dist
      - uses: actions/upload-artifact@v4
        with:
          name: skills-${{ matrix.os }}
          path: dist/
