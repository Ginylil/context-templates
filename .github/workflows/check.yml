name: Check skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check canonical diagram resources and examples
        run: python scripts/dynamic_umls.py --check
      - name: Validate catalog
        run: python scripts/skills.py check
      - name: Check standalone lifecycle resources
        run: python scripts/ct_lifecycle.py --check
      - name: Check public files for credential signatures
        run: python scripts/secret_scan.py
      - name: Test safe installation and packaging
        run: python -m unittest discover -s tests -v
      - name: Build downloadable skill archives
        run: python scripts/skills.py build
      - name: Check packaged files for credential signatures
        run: python scripts/secret_scan.py --packages dist
      - uses: actions/upload-artifact@v4
        with:
          name: skills-${{ matrix.os }}
          path: dist/
